apiVersion: v1
kind: PersistentVolume
metadata:
  name: nfs-pv
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteMany

  nfs:
    server: "{{ .Values.NFS_SERVER }}"
    path: "{{ .Values.NFS_PATH }}"
  mountOptions:
    - "{{ .Values.NFS_Options }}"
